<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Numberblocks — whole numbers & decimals</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red:    #DE151D;
    --orange: #E89223;
    --yellow: #E6C40C;
    --gap: 0px;          /* animates 0 -> grid lines when the square divides */
    --face: 100%;        /* One's face: full block (whole) -> one cell (divided) */
    --sq: 300px;         /* decimal square size, set by JS to fit the stage */
  }

  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    gap: 6px;
  }

  /* ===== top area: info (left) + stage (right) ===== */
  #main { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; gap: 16px; }

  #info {
    flex: 0 0 auto; width: clamp(190px, 30vw, 380px);
    display: flex; flex-direction: column; justify-content: center;
    text-align: left; padding-left: 6px;
  }
  #title { font-size: clamp(15px, 1.8vw, 22px); font-weight: 800;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3); opacity: 0.95; line-height: 1.1; }
  #decimal-display { font-size: clamp(46px, 7.3vw, 96px); font-weight: 900; color: #FFD700;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.35); line-height: 1; margin: 2px 0 4px;
    letter-spacing: 0; white-space: nowrap; overflow-wrap: normal; word-break: normal; font-size-adjust: from-font; }
  #subtitle { font-size: clamp(13px, 1.5vw, 19px); font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3); min-height: 2.6em; }
  #fraction { font-size: clamp(16px, 2.1vw, 28px); font-weight: 900;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3); min-height: 1.2em; margin-top: 6px; }
  #fraction .frac { color: #fff; }
  #fraction .reduced { color: #7CFF9B; }
  #fraction .eq { color: #FFD700; margin: 0 6px; }
  #breakdown { font-size: clamp(13px, 1.6vw, 20px); font-weight: 700; min-height: 1.3em; margin-top: 2px; }
  #breakdown .t { color: #FF8A8A; }
  #breakdown .h { color: #FFE873; }
  #breakdown .q, #breakdown .p { color: #FFFFFF; }

  /* ===== the stage ===== */
  #stage-wrap { flex: 1 1 auto; min-width: 0; min-height: 0; height: 100%;
    display: flex; align-items: center; justify-content: center; position: relative; }
  #focus-rail {
    position: absolute; left: 0; bottom: 12px; height: 44px; width: 100%;
    z-index: 1; pointer-events: none; opacity: 0;
    transition: opacity 0.3s ease;
  }
  #focus-rail svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  #focus-rail.on { opacity: 1; }
  #focus-rail .base { stroke: rgba(255,255,255,0.26); stroke-width: 5; stroke-linecap: round; }
  #focus-rail .focus { stroke: #F5E28A; stroke-width: 10; stroke-linecap: round; }
  #focus-rail .focus-shadow { stroke: rgba(232,132,37,0.52); stroke-width: 16; stroke-linecap: round; }
  #focus-rail .pointer { fill: #E89223; opacity: 0.88; }
  #focus-rail .pointer-inner { fill: #F5E28A; }
  #focus-rail .tick { stroke: rgba(255,255,255,0.2); stroke-width: 2; stroke-linecap: round; }
  #focus-rail .label-dot { fill: rgba(255,255,255,0.28); }
  #focus-rail .label-dot.focused { fill: #F5E28A; }
  #focus-rail .ghost { stroke: rgba(255,255,255,0.07); stroke-width: 2; stroke-linecap: round; }

  /* --- decimal square --- */
  #square {
    position: relative; z-index: 2; width: var(--sq); height: var(--sq);
    transform: scale(0.26); transform-origin: center center;
    transition: transform 0.95s cubic-bezier(0.34, 1.4, 0.64, 1);
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35));
  }
  #square.enlarged { transform: scale(1); }
  #square.hidden, #whole.hidden { display: none; }

  #grid {
    width: 100%; height: 100%;
    display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
    gap: var(--gap);
    background: rgba(0,0,0,0.28); border: 4px solid rgba(0,0,0,0.28); border-radius: 12px;
    padding: var(--gap);
    transition: gap 0.6s ease, padding 0.6s ease, background 0.6s ease;
  }
  .cell { background: var(--red); border-radius: 0; position: relative;
    transition: background-color 0.35s ease, border-radius 0.5s ease; }
  #grid.divided .cell { border-radius: 3px; }
  /* per-cell shine only once divided; before that it's one solid block */
  #grid.divided .cell::after {
    content: ''; position: absolute; top: 0; left: 0; right: 55%; bottom: 55%;
    background: rgba(255,255,255,0.22); border-radius: 3px 0 0 0; pointer-events: none;
  }
  .cell.empty      { background: rgba(255,255,255,0.13); }
  .cell.tenth      { background: var(--red); }
  .cell.hundredth  { background: var(--yellow); }
  .cell.quarter    { background: var(--red); }
  @keyframes pop { 0%{transform:scale(0.4);} 60%{transform:scale(1.12);} 100%{transform:scale(1);} }
  .cell.filling { animation: pop 0.3s ease; z-index: 2; }

  /* one big shine while the square is still a single solid block */
  #unishine { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    border-radius: 12px; overflow: hidden; transition: opacity 0.4s ease; }
  #unishine::after { content: ''; position: absolute; top: 0; left: 0; right: 55%; bottom: 55%;
    background: rgba(255,255,255,0.25); border-radius: 12px 0 0 0; }
  #unishine.off { opacity: 0; }

  /* quarter guide cross */
  #quarter-guide { position: absolute; inset: 4px; z-index: 4; pointer-events: none;
    opacity: 0; transition: opacity 0.5s ease; }
  #quarter-guide.on { opacity: 1; }
  #quarter-guide::before, #quarter-guide::after { content: ''; position: absolute;
    background: rgba(255,255,255,0.9); box-shadow: 0 0 6px rgba(0,0,0,0.45); border-radius: 2px; }
  #quarter-guide::before { left: 50%; top: 0; bottom: 0; width: 4px; transform: translateX(-50%); }
  #quarter-guide::after  { top: 50%; left: 0; right: 0; height: 4px; transform: translateY(-50%); }

  /* One's face on the square */
  #face { position: absolute; top: 0; left: 0; width: var(--face); height: var(--face);
    z-index: 6; pointer-events: none; transition: width 0.6s ease, height 0.6s ease; }
  #face .square-one-face { position: absolute; inset: 0; }
  #square.enlarged #face .mouth {
    border-width: max(5px, calc(var(--mouth-line, 3px) * 1.35));
  }

  /* --- whole-number / mixed stage --- */
  #whole { position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: center; gap: 0px;
    max-width: 100%; max-height: 100%; transition: gap 0.8s cubic-bezier(0.34,1.2,0.64,1), transform 0.55s cubic-bezier(0.34,1.2,0.64,1); }
  #whole.large-zoom { max-width: none; transform-origin: 0 100%; }
  .wgroup { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wgroup.zoomable { cursor: zoom-in; transition: opacity 0.25s ease, transform 0.45s cubic-bezier(0.34,1.2,0.64,1); }
  .wgroup.focused { cursor: default; }
  .wgrid  { display: grid; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); }
  .wlabel { font-size: clamp(12px, 1.6vw, 20px); font-weight: 900; color: #fff;
    text-shadow: 2px 2px 3px rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.5s ease; }
  .wlabel.show { opacity: 1; }
  .wplus { align-self: center; font-size: clamp(20px,3vw,44px); font-weight: 900; color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3); padding-bottom: 26px; opacity: 0;
    transition: opacity 0.4s ease; }
  .wplus.show { opacity: 1; }

  .wcell { border-radius: 3px; border: 2px solid rgba(0,0,0,0.2); position: relative;
    opacity: 0; transform: translateY(-40px) scale(0.6);
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  .wcell.show { opacity: 1; transform: none; }
  .wcell::after { content: ''; position: absolute; top: 0; left: 0; right: 55%; bottom: 55%;
    background: rgba(255,255,255,0.22); border-radius: 3px 0 0 0; pointer-events: none; }
  .wcell.subtracted { outline: 3px solid #fff; outline-offset: -1px; z-index: 3; }

  /* Numberblocks dance gently at rest */
  @keyframes idleBob {
    0%,100% { transform: translateY(0) rotate(0deg); }
    22% { transform: translateY(-5px) rotate(-1.6deg); }
    50% { transform: translateY(0) rotate(0deg); }
    72% { transform: translateY(-5px) rotate(1.6deg); }
  }
  .dancing { animation: idleBob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes oneIdleBob {
    0%,100% { transform: translateY(0); }
    25% { transform: translateY(-6px); }
    50% { transform: translateY(0); }
    75% { transform: translateY(-4px); }
  }
  .dancing.one-figure { animation-name: oneIdleBob; }

  /* negative numbers: native colors, muted into "ghost" blocks */
  .neg .wcell {
    filter: grayscale(0.38) saturate(0.62) brightness(0.92);
    opacity: 0.82;
    border-color: rgba(255,255,255,0.58) !important;
    outline: 2px dashed rgba(255,255,255,0.78);
    outline-offset: 3px;
  }
  .neg .wcell::after {
    inset: 0;
    border-radius: inherit;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.42) 0 2px, transparent 2px 8px),
      rgba(230,235,255,0.18);
    opacity: 1;
  }
  .neg .nb-eye { background: rgba(245,247,255,0.82); }
  .neg .nb-mouth { border-color: rgba(55,55,80,0.72); }

  /* thousand-blocks: each cell is one 1000, decorated with a grid pattern */
  .wcell.thousand::before {
    content: ''; position: absolute; inset: 3px; z-index: 1; pointer-events: none; border-radius: 2px;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.45) 0 1.5px, transparent 1.5px 20%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.45) 0 1.5px, transparent 1.5px 20%);
  }
  .wcell.hundred-unit {
    box-shadow: inset 0 0 0 2px rgba(126,98,0,0.18), inset 3px 4px 0 rgba(255,255,255,0.2), inset -4px -5px 0 rgba(0,0,0,0.13);
  }
  .wcell.hundred-unit::before {
    content: ''; position: absolute; inset: 4px; z-index: 1; pointer-events: none; border-radius: 2px;
    background-image:
      repeating-linear-gradient(0deg, rgba(126,98,0,0.45) 0 1.25px, transparent 1.25px 20%),
      repeating-linear-gradient(90deg, rgba(126,98,0,0.45) 0 1.25px, transparent 1.25px 20%);
  }

  /* divide-by-10: a decimal point that hops across a big number */
  .decshift { font-size: clamp(44px, 11vw, 108px); font-weight: 900; color: #FFD700;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.35); display: flex; align-items: baseline; letter-spacing: 2px; }
  .decshift .dig { display: inline-block; }
  .decshift .dot { display: inline-block; color: #7CFF9B; font-weight: 900; }
  .decshift .dot.hop { animation: dotHop 0.55s ease; }
  @keyframes dotHop { 0% { transform: translateY(0); } 45% { transform: translateY(-26px) scale(1.3); } 100% { transform: translateY(0); } }

  /* combine (a + b) animation */
  #combine { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-height: 100%; }
  #combine.hidden { display: none; }
  .op-wrap { display: flex; flex-direction: column; align-items: center;
    transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s; }
  .op-grid { display: inline-grid; gap: 3px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); }
  .op-label { font-size: clamp(20px,4.5vw,40px); font-weight: 900; color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-top: 8px; }
  .op-sym { font-size: clamp(30px,6vw,58px); font-weight: 900; color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3); align-self: center; opacity: 0; transition: opacity 0.3s; padding-bottom: 34px; }
  .op-sym.show { opacity: 1; }
  .mcell { border-radius: 4px; border: 2px solid rgba(0,0,0,0.2); position: relative; overflow: hidden; }
  .mcell::after { content: ''; position: absolute; top: 0; left: 0; right: 50%; bottom: 50%;
    background: rgba(255,255,255,0.25); border-radius: 4px 0 0 0; }
  .walk-in-left  { animation: walkLeft 1.8s ease-out forwards; }
  .walk-in-right { animation: walkRight 1.8s ease-out forwards; }
  @keyframes walkLeft {
    0%{transform:translateX(-110vw) rotate(0);} 16%{transform:translateX(-70vw) translateY(-12px) rotate(8deg);}
    32%{transform:translateX(-30vw) rotate(8deg);} 48%{transform:translateX(0) rotate(5deg);}
    60%{transform:translateX(0) rotate(0);} 100%{transform:translateX(0) rotate(0);} }
  @keyframes walkRight {
    0%{transform:translateX(110vw) rotate(0);} 16%{transform:translateX(70vw) translateY(-12px) rotate(-8deg);}
    32%{transform:translateX(30vw) rotate(-8deg);} 48%{transform:translateX(0) rotate(-5deg);}
    60%{transform:translateX(0) rotate(0);} 100%{transform:translateX(0) rotate(0);} }

  /* mixed-number unit squares */
  .unit { position: relative; border-radius: 8px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
    opacity: 0; transform: scale(0.6); transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .unit.show { opacity: 1; transform: none; }
  .unit.solid { background: var(--red); border: 3px solid rgba(0,0,0,0.25); overflow: hidden; }
  .unit.solid::after { content: ''; position: absolute; top: 0; left: 0; right: 55%; bottom: 55%;
    background: rgba(255,255,255,0.24); border-radius: 6px 0 0 0; }
  .unit-grid { display: grid; grid-template-columns: repeat(10,1fr); grid-template-rows: repeat(10,1fr);
    gap: 2px; padding: 2px; background: rgba(0,0,0,0.28); border: 3px solid rgba(0,0,0,0.28); border-radius: 8px; }
  .ucell { border-radius: 2px; background: rgba(255,255,255,0.13); }
  .ucell.tenth { background: var(--red); }
  .ucell.hundredth { background: var(--yellow); }
  .ucell.quarter { background: var(--red); }
  .ulabel { position: absolute; bottom: -26px; left: 0; right: 0; text-align: center;
    font-size: clamp(12px,1.6vw,20px); font-weight: 900; color: #fff; text-shadow: 2px 2px 3px rgba(0,0,0,0.35); }
  /* combined mixed figure: fade the head's grid + outline and soften its shadow
     so the decimal square reads as part of one body */
  .unit.merged-head { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.16)); }
  .unit.merged-head .unit-grid { background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.08); }
  .unit.merged-head .ucell:not(.tenth):not(.hundredth):not(.quarter) { background: rgba(255,255,255,0.07); }

  /* shared face */
  .nb-face { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: visible; }
  .nb-eye { width: 22%; height: 28%; background: white; border-radius: 50%; position: absolute; top: 22%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset -2px -3px 0 rgba(0,0,0,0.12), 0 0 2px rgba(0,0,0,0.3); }
  .nb-eye::after { content: ''; width: 45%; height: 45%; background: var(--pupil, #222); border-radius: 50%; }
  .nb-eye-left  { left: 20%; }
  .nb-eye-right { right: 20%; }
  .nb-eye-single { width: 34%; height: 42%; left: 50%; top: 25%; transform: translateX(-50%); }
  .nb-eye-single::after { width: 42%; height: 42%; }
  .nb-mouth { position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
    width: 30%; height: 16%; border: 3px solid var(--mouth, #333); border-top: none; border-radius: 0 0 60% 60%;
    background: rgba(255,255,255,0.15); }

  /* ===== full Numberblocks character (eyes + mouth + arms + legs + hat) =====
     A pixel-positioned overlay layered over the whole figure box, so limbs can
     extend past the blocks. Built by buildCharacter() for the friendly 1–10. */
  .nb-char { position: absolute; inset: 0; z-index: 6; pointer-events: none; overflow: visible; }
  .nb-char .eye { position: absolute; background: var(--eye, #fff); border-radius: 50%;
    box-shadow: inset -2px -3px 0 rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .nb-char .eye::after { content: ''; width: 44%; height: 44%; background: var(--pupil, #262026);
    border-radius: 50%; box-shadow: 1px 1px 0 rgba(255,255,255,0.35) inset; }
  .nb-char.one-char .eye {
    border: max(7px, var(--one-ring, 8px)) solid #8e1d2b;
    box-shadow: inset -3px -4px 0 rgba(0,0,0,0.06), 0 4px 5px rgba(92,0,12,0.28);
  }
  .nb-char.one-char .eye::after {
    width: 38%; height: 38%; transform: translate(13%, 4%);
    box-shadow: 0 0 0 999px transparent, 3px 3px 0 rgba(255,255,255,0.42) inset;
  }
  .nb-char .mouth { position: absolute; border: max(2px, var(--mouth-line, 3px)) solid var(--mouth, #2a2a2a);
    border-top: none; border-radius: 0 0 70% 70%; background: rgba(255,255,255,0.18); box-sizing: border-box; }
  .nb-char .mouth.smile-open { background: radial-gradient(circle at 50% 0, #fff 0 22%, #5b1228 24% 100%);
    border-radius: 0 0 999px 999px; }
  .nb-char.one-char .mouth {
    border: 0;
    background: linear-gradient(180deg, #9d2534 0%, #691526 100%);
    border-radius: 44% 44% 55% 55% / 42% 42% 72% 72%;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.12), inset 0 -4px 0 rgba(71,0,16,0.28), 0 3px 4px rgba(80,0,15,0.24);
  }
  .nb-char.one-char .mouth.one-smile {
    overflow: hidden;
  }
  .nb-char.one-char .mouth.one-smile::before {
    content: ''; position: absolute; left: 13%; right: 13%; top: 28%; bottom: 15%;
    border-radius: 0 0 999px 999px;
    background: #171014;
  }
  .nb-char.one-char .mouth.one-smile::after {
    content: ''; position: absolute; left: 26%; right: 22%; top: 34%; height: 18%;
    border-radius: 0 0 999px 999px;
    background: #fff;
    box-shadow: 0 1px 0 rgba(0,0,0,0.18);
  }
  .nb-char .cheek {
    position: absolute; z-index: 4; width: 16%; height: 9%;
    border-radius: 50%; background: rgba(255,88,118,0.52);
    filter: blur(1px); pointer-events: none;
  }
  .nb-char .mouth.grin { background: #fff; border-top: max(2px, var(--mouth-line, 3px)) solid var(--mouth, #2a2a2a);
    border-radius: 0 0 50% 50%; }
  .nb-char .limb {
    position: absolute;
    background:
      radial-gradient(circle at var(--bulb-x, 82%) 50%, rgba(255,255,255,0.28) 0 18%, transparent 19%),
      linear-gradient(135deg, var(--limb1, currentColor), var(--limb2, currentColor));
    border: 2px solid rgba(0,0,0,0.22);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,0.2), inset -2px -2px 0 rgba(0,0,0,0.1);
    transform-origin: center;
  }
  .nb-char .arm-limb {
    border-radius: 72% 95% 95% 72% / 58% 78% 78% 58%;
    clip-path: polygon(0 25%, 56% 15%, 100% 0, 100% 100%, 56% 85%, 0 75%);
  }
  .nb-char .leg-limb {
    border-radius: 58% 58% 82% 82% / 42% 42% 96% 96%;
    clip-path: polygon(25% 0, 75% 0, 88% 55%, 100% 100%, 0 100%, 12% 55%);
  }
  .nb-char.one-char .arm-limb {
    border-radius: 72% 96% 96% 72% / 54% 86% 86% 54%;
  }
  .nb-char.one-char .leg-limb {
    border-radius: 58% 58% 90% 90% / 34% 34% 98% 98%;
  }
  .nb-char .badge, .nb-char .hat { position: absolute; pointer-events: none; }
  .nb-char .badge { z-index: 8; font-weight: 900; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,0.32);
    display: flex; align-items: center; justify-content: center; }
  .nb-char .hat { filter: drop-shadow(0 2px 1px rgba(0,0,0,0.25)); }
  .nb-char .accessory { position: absolute; z-index: 8; pointer-events: none; }
  .nb-char .glasses-ring { position: absolute; border: var(--glasses-line, 6px) solid #7d458f;
    border-radius: 50%; box-sizing: border-box; filter: drop-shadow(0 2px 1px rgba(0,0,0,0.24)); }
  .nb-char .glasses-bridge { position: absolute; height: var(--glasses-line, 6px); background: #7d458f;
    border-radius: 999px; box-shadow: 0 2px 1px rgba(0,0,0,0.2); }
  .nb-char .brow { position: absolute; background: var(--brow, #245b25); border-radius: 18% 18% 28% 28%;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,0.08), 0 2px 2px rgba(0,0,0,0.24); }
  .nb-char .crown { display: flex; align-items: flex-end; justify-content: center; gap: 2px;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.22)); }
  .nb-char .crown-point { width: 32%; height: 100%; background: #db2533;
    clip-path: polygon(50% 0, 100% 100%, 0 100%); position: relative; }
  .nb-char .crown-point::after { content: ''; position: absolute; left: 50%; top: -16%;
    width: 34%; aspect-ratio: 1; border-radius: 50%; background: #f2d52a; transform: translateX(-50%); }
  .nb-char .star-accessory { color: #f6dc25; text-shadow: 0 2px 0 #14718e, 0 3px 3px rgba(0,0,0,0.25); }
  .nb-char .pip { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.92);
    box-shadow: inset -1px -1px 0 rgba(0,0,0,0.18), 0 1px 1px rgba(0,0,0,0.2); }

<div id="controls">

<script>
// ===================== SERVER LOG (fire-and-forget) =====================
const SERVER = window.location.origin;
function serverLog(entry) {
  try {
    fetch(`${SERVER}/log`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry) }).catch(() => {});
  } catch {}
}

// ===================== NUMBERBLOCKS COLORS (ported) =====================
const BASE_COLORS = { 1:'#DE151D',2:'#E89223',3:'#E6C40C',4:'#38B500',5:'#23B0DB',
  6:'#5A35C3',7:'rainbow',8:'#FD40A4',9:'grey3',10:'#EEEEEE' };
const TENS_COLORS = { 1:'#EEEEEE',2:'#F4A0A0',3:'#F5E6A0',4:'#B8F0A0',5:'#A0E4F0',
  6:'#C4A0F0',7:'rainbow-light',8:'#F0A0D4',9:'#C4C8CB',10:'#F4A0A0' };
const TENS_BORDERS = { 1:'#DE151D',2:'#DE151D',3:'#C4A000',4:'#2A8000',5:'#1A8AAA',
  6:'#4A2A9A',7:'#AA77CC',8:'#CC70A4',9:'#999999',10:'#DE151D' };
const RAINBOW = ['#DE151D','#E89223','#E6C40C','#38B500','#23B0DB','#4B0082','#8B00FF'];
const RAINBOW_LIGHT = ['#F4A0A0','#F5CCA0','#F5E6A0','#B8F0A0','#A0E4F0','#B0A0D0','#D0A0F0'];
const GREY_SHADES = ['#8A8B8F','#A5A9AC','#C4C8CB'];

function getBlockColorAndBorder(n, i) {
  if (n <= 10) {
    if (n === 7) return { bg: RAINBOW[i % RAINBOW.length], border: null };
    if (n === 9) return { bg: GREY_SHADES[i % 3], border: null };
    if (n === 10) return { bg: '#EEEEEE', border: '#DE151D' };
    return { bg: BASE_COLORS[n], border: null };
  }
  const tensDigit = Math.floor(n / 10), onesDigit = n % 10, tensCount = tensDigit * 10;
  if (onesDigit === 0 || i < tensCount) {
    const td = tensDigit;
    if (td === 7) return { bg: RAINBOW_LIGHT[i % RAINBOW_LIGHT.length], border: TENS_BORDERS[7] };
    if (td === 9) return { bg: '#C4C8CB', border: TENS_BORDERS[9] };
    return { bg: TENS_COLORS[td], border: TENS_BORDERS[td] };
  } else {
    const oi = i - tensCount;
    if (onesDigit === 7) return { bg: RAINBOW[oi % RAINBOW.length], border: null };
    if (onesDigit === 9) return { bg: GREY_SHADES[oi % 3], border: null };
    return { bg: BASE_COLORS[onesDigit], border: null };
  }
}

// Compact character shape for 1-9 (ported from the existing game)
function getShape(n) {
  if (n <= 0) return { rows: 0, cols: 0, lastRowCols: 0 };
  if (n <= 7) return { rows: n, cols: 1, lastRowCols: 1 };
  let cols = 1;
  for (let c = 2; c * c <= n; c++) if (n % c === 0) cols = c;
  if (cols >= 2) return { rows: n / cols, cols, lastRowCols: cols };
  cols = getShape(n - 1).cols; if (cols < 2) cols = 2;
  return { rows: Math.ceil(n / cols), cols, lastRowCols: n % cols || cols };
}

// Place-value parts (largest first)
function getPlaceParts(n) {
  const H = Math.floor(n / 100), T = Math.floor(n / 10) % 10, O = n % 10;
  const parts = [];
  if (H > 0) parts.push({ kind: 'hundreds', value: H * 100, digit: H });
  if (T > 0) parts.push({ kind: 'tens', value: T * 10, digit: T });
  if (O > 0) parts.push({ kind: 'ones', value: O, digit: O });
  return parts;
}
function placeDims(p) {
  if (p.kind === 'ones') return { cols: 1, rows: p.digit };
  if (p.kind === 'tens') return { cols: p.digit, rows: 10 };
  return { cols: p.digit * 10, rows: 10 };
}
function placeColorFn(p) {
  if (p.kind === 'hundreds') return (i) => getBlockColorAndBorder(p.digit, i);
  return (i) => getBlockColorAndBorder(p.value, i);
}

// ===================== SHAPE PRIMITIVES =====================
// Every whole number has a list of available shapes: all factor-pair rectangles
// (upright before wide, most-square first) plus a base-ten place-value layout.
// Clicking a Numberblock rotates through this list.
function allShapes(n) {
  if (n <= 0) return [{ kind: 'rect', rows: 0, cols: 0 }];
  const root = Math.sqrt(n);
  const ones = n % 10;
  const digitRoot = Math.sqrt(ones);
  const rects = [];
  if (Number.isInteger(root) && root >= 3 && Number.isInteger(digitRoot) && digitRoot >= 1) {
    const inner = digitRoot;
    if (inner < root) rects.push({ kind: 'center-square', side: root, inner });
  }
  for (let c = 1; c * c <= n; c++) if (n % c === 0) {
    const r = n / c;
    rects.push({ rows: r, cols: c });
    if (r !== c) rects.push({ rows: c, cols: r });
  }
  // most-square first; within a pair, upright (taller) before wide
  rects.sort((a, b) => (Math.abs(a.rows - a.cols) - Math.abs(b.rows - b.cols)) || (b.rows - a.rows));
  const shapes = rects.map(x => ({ kind: 'rect', rows: x.rows, cols: x.cols }));
  // Step Squad! triangular numbers (3,6,10,15,21,...) can stack as a staircase.
  const tk = (Math.sqrt(8 * n + 1) - 1) / 2;
  if (Number.isInteger(tk) && tk >= 2 && tk <= 40) shapes.push({ kind: 'stairs', k: tk });
  if (n >= 10 && getPlaceParts(n).length >= 2) shapes.push({ kind: 'place' });
  return shapes;
}
// Preferred default: the most-square rectangle when it's reasonably compact
// (25 -> 5x5, 12 -> 4x3, 100 -> 10x10); otherwise the place-value layout
// (34 -> 30+4, 102 -> 100+2).
function defaultShapeIndex(n, shapes) {
  const center = shapes.findIndex(s => s.kind === 'center-square');
  if (n < 100 && center >= 0) return center;
  const best = shapes[0];
  const pi = shapes.findIndex(s => s.kind === 'place');
  if (n >= 1000) {  // place value gets unwieldy; prefer a compact rectangle
    if (best && best.kind === 'rect' && best.cols >= 2 && best.rows / best.cols <= 2.5) return 0;
    return pi >= 0 ? pi : 0;
  }
  if (n >= 100) {   // hundreds read best as place value, unless a clean square (100, 144)
    if (best && best.kind === 'rect' && best.cols === best.rows) return 0;
    return pi >= 0 ? pi : 0;
  }
  if (best && best.kind === 'rect' && best.cols >= 2 && best.rows / best.cols <= 2) return 0;
  if (n <= 9) return 0;
  return pi >= 0 ? pi : 0;
}
function shapeDims(n, shape) {
  if (shape.kind === 'rect') return { cols: shape.cols, rows: shape.rows, gaps: 0 };
  if (shape.kind === 'stairs') return { cols: shape.k, rows: shape.k, gaps: 0 };
  if (shape.kind === 'center-square') return { cols: shape.side, rows: shape.side, gaps: 0 };
  const parts = getPlaceParts(n);
  return { cols: parts.reduce((s, p) => s + placeDims(p).cols, 0),
           rows: Math.max(...parts.map(p => placeDims(p).rows), 1),
           gaps: (parts.length - 1) * 10 };
}

// ===================== PLACE-VALUE COLOR =====================
// Single digits: assigned color. Tens: pastel of the digit. Hundreds: a
// checkerboard of the digit's regular + pastel color. (10 white + 4 green = 14.)
function hundredsCell(d, i, r, c) {
  let base, pastel, border = null;
  if (d === 7) { base = RAINBOW[i % 7]; pastel = RAINBOW_LIGHT[i % 7]; }
  else if (d === 9) { base = GREY_SHADES[i % 3]; pastel = '#D8DADC'; }
  else if (d === 10) { base = '#EEEEEE'; pastel = '#F7C6C6'; border = '#DE151D'; }
  else if (d === 1) { base = '#DE151D'; pastel = '#FA8072'; }   // Hundred: salmon + red
  else { base = BASE_COLORS[d]; pastel = TENS_COLORS[d]; }
  return { bg: ((r + c) % 2 === 1) ? pastel : base, border };
}
function unitStyle(n, i, r, c) {
  if (n >= 1000) {   // thousands+: solid single-digit-equivalent colour (1000 red, 2000 orange...)
    const d = ((Math.floor(n / 1000) - 1) % 10) + 1;
    return getBlockColorAndBorder(d, i);
  }
  if (n < 100) return getBlockColorAndBorder(n, i);
  const Hd = Math.floor(n / 100), hCount = Hd * 100;
  if (i < hCount) return hundredsCell(Hd, i, r, c);
  const rem = n % 100;
  return getBlockColorAndBorder(rem === 0 ? 100 : rem, i - hCount);
}

// ===================== INPUT PARSING (math, fractions, percents) =====================
function evalExpr(raw) {
  let s = String(raw).trim().toLowerCase();
  if (s === '') return null;
  s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/x/g, '*').replace(/\s+/g, '');
  s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
  if (!/^[0-9.+\-*/()]+$/.test(s)) return null;
  if (/[+\-*/.]{3,}/.test(s)) return null;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch { return null; }
}

// A single "a op b" with whole operands (1-100) and a whole result -> animate
// the two blocks walking in and combining. Returns {a,op,b,result} or null.
function parseBinary(raw) {
  let s = String(raw).trim().toLowerCase()
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/x/g, '*').replace(/\s+/g, '');
  const m = s.match(/^(\d+)([+\-*/])(\d+)$/);
  if (!m) return null;
  const a = parseInt(m[1], 10), b = parseInt(m[3], 10), op = m[2];
  if (a < 1 || a > 100 || b < 1 || b > 100) return null;
  let result;
  switch (op) { case '+': result = a+b; break; case '-': result = a-b; break;
    case '*': result = a*b; break; case '/': result = a/b; break; }
  if (!Number.isInteger(result) || result < 1) return null;
  const sym = op === '*' ? '×' : op === '/' ? '÷' : op;
  return { a, b, op: sym, opRaw: op, result };
}

// Equations: "a op b = c" (combine/subtract) or "c = a + b" (split). Returns a
// descriptor or null. Splits only make sense for addition.
function parseEquation(raw) {
  let s = String(raw).trim().toLowerCase()
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/x/g, '*').replace(/\s+/g, '');
  const m = s.match(/^([^=]+)=([^=]+)$/);
  if (!m) return null;
  const numRe = /^\d+$/, binRe = /^(\d+)([+\-*/])(\d+)$/;
  const doOp = (bm) => { const a = +bm[1], b = +bm[3], op = bm[2];
    const r = op === '+' ? a+b : op === '-' ? a-b : op === '*' ? a*b : a/b; return { a, b, op, r }; };
  if (numRe.test(m[1]) && binRe.test(m[2])) {         // total = a + b  -> split
    const e = doOp(m[2].match(binRe));
    if (e.op !== '+' || +m[1] !== e.r) return null;
    if (e.a < 1 || e.b < 1 || e.a > 100 || e.b > 100 || +m[1] > 200) return null;
    return { type: 'split', total: +m[1], a: e.a, b: e.b, op: '+' };
  }
  if (numRe.test(m[2]) && binRe.test(m[1])) {         // a op b = c  -> combine/subtract
    const e = doOp(m[1].match(binRe));
    if (!Number.isInteger(e.r) || e.r < 1 || +m[2] !== e.r) return null;
    if (e.a < 1 || e.b < 1 || e.a > 100 || e.b > 100) return null;
    return { type: 'op', a: e.a, b: e.b, op: e.op, result: e.r,
      sym: e.op === '*' ? '×' : e.op === '/' ? '÷' : e.op };
  }
  return null;
}

// "a / 10", "a / 100", "a / 1000" -> the decimal-point-hop animation.
function parseDivByPowerOf10(raw) {
  let s = String(raw).trim().toLowerCase()
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/x/g, '*').replace(/\s+/g, '');
  const m = s.match(/^(\d+)\/(10|100|1000)$/);
  if (!m) return null;
  const a = +m[1], b = +m[2];
  return { a, b, result: a / b, places: Math.round(Math.log10(b)) };
}
// Insert a decimal point `places` from the right of integer a (with leading
// zeros as needed), trimming trailing zeros. 250,1 -> "25"; 250,3 -> "0.25".
function shiftedString(a, places) {
  let s = String(a);
  while (s.length <= places) s = '0' + s;
  const idx = s.length - places;
  let res = places > 0 ? s.slice(0, idx) + '.' + s.slice(idx) : s;
  if (res.includes('.')) res = res.replace(/0+$/, '').replace(/\.$/, '');
  res = res.replace(/^0+(?=\d)/, '');
  if (res.startsWith('.')) res = '0' + res;
  return res;
}

const MAX_WHOLE = 999000, MAX_MIXED = 999000;
// Returns { mode:'whole'|'decimal'|'mixed'|'negative', ... } or null.
function routeValue(val) {
  if (val == null || !isFinite(val)) return null;
  if (val < 0) return { mode: 'negative', k: Math.min(Math.round(-val), MAX_WHOLE) };
  if (val < 1) {
    let n = Math.round(val * 100);
    if (n >= 100) return { mode: 'whole', k: 1, exact: true };
    return { mode: 'decimal', n, exact: Math.abs(val * 100 - n) < 1e-9, disp: fmtExact(val) };
  }
  let whole = Math.floor(val + 1e-9);
  let n = Math.round((val - whole) * 100);
  if (n >= 100) { whole += 1; n = 0; }
  if (n === 0) {  // integer
    if (whole > MAX_WHOLE) whole = MAX_WHOLE;
    return { mode: 'whole', k: whole, exact: true };
  }
  // mixed number: whole + n hundredths (shown as whole blocks + a fractional block)
  const exact = Math.abs((val - whole) * 100 - n) < 1e-9;
  if (whole > MAX_MIXED) return { mode: 'whole', k: Math.min(whole, MAX_WHOLE), exact: false };
  return { mode: 'mixed', whole, n, exact, disp: fmtExact(val) };
}

// ===================== SHARED HELPERS =====================
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function fmtDecimal(n) { return n === 0 ? '0' : '0.' + String(n).padStart(2, '0'); }
function fmtMixed(whole, n) { return fmtInt(whole) + (n / 100).toString().slice(1); } // 1 + .5 -> "1.5"
function fmtInt(n) { return Math.trunc(n).toLocaleString('en-US'); }
// Truthful decimal string: trims float noise + trailing zeros, keeps every real
// digit. 0.125 -> "0.125" (NOT rounded to 0.13, even though blocks show 13/100).
function fmtExact(val) { return (+(+val).toFixed(6)).toString(); }

// Build a full Numberblocks-style character (googly eyes, mouth, arms + white
// hands, legs + feet, optional hat) as a pixel-positioned overlay sized to a
// `cols`x`rows` figure of `cs`px cells. One (n===1) gets the single cyclops eye.
function buildCharacter(n, cs, cols, rows) {
  const W = cols * cs, H = rows * cs;
  const spec = CHARACTER_SPECS[n] || CHARACTER_SPECS[2];
  const isOne = n === 1;
  const stairs = n > 0 && Number.isInteger((Math.sqrt(8 * n + 1) - 1) / 2) && cols === rows && n !== 1 && n !== 4 && n !== 9;
  // face sits on the TOP block; for a staircase the top block is the single
  // top-left cell, otherwise it spans the whole top row.
  const faceCX = stairs ? cs / 2 : W / 2;
  const faceSpan = stairs ? cs : W;
  const ov = document.createElement('div');
  ov.className = 'nb-char' + (n === 1 ? ' one-char' : '');
  ov.style.color = getBlockColorAndBorder(n, 0).bg;
  ov.style.setProperty('--limb1', spec.limb1);
  ov.style.setProperty('--limb2', spec.limb2);
  ov.style.setProperty('--mouth', spec.mouth);
  ov.style.setProperty('--pupil', spec.pupil || '#262026');
  ov.style.setProperty('--mouth-line', Math.max(2, cs * 0.075) + 'px');
  ov.style.setProperty('--one-ring', Math.max(4, cs * 0.075) + 'px');

  // eyes
  if (isOne) {
    ov.appendChild(makeOneFaceHTML(cs, W, H, false));
  } else {
    const eyeD = Math.max(9, cs * spec.eyeScale);
    const eyeCY = cs * (spec.eyeY || 0.45);
    const eyeCenters = [];
  const mkEye = (cx) => { const e = document.createElement('div'); e.className = 'eye';
    e.style.width = e.style.height = eyeD + 'px';
    e.style.left = (cx - eyeD / 2) + 'px'; e.style.top = (eyeCY - eyeD / 2) + 'px';
    ov.appendChild(e); eyeCenters.push(cx); };
    if (spec.eyes === 1) mkEye(faceCX);
    else { const sp = Math.min(faceSpan * (spec.eyeSpread || 0.24), cs * 0.62); mkEye(faceCX - sp); mkEye(faceCX + sp); }
    addAccessories(ov, n, spec, cs, W, H, eyeCenters, eyeD, eyeCY);

    // mouth
    const mw = cs * (spec.mouthW || 0.42), mh = cs * (spec.mouthH || (spec.mouthType === 'smile-open' ? 0.24 : 0.2));
    const mo = document.createElement('div');
    mo.className = 'mouth ' + (spec.mouthType || 'smile');
    mo.style.width = mw + 'px'; mo.style.height = mh + 'px';
    mo.style.left = (faceCX - mw / 2) + 'px'; mo.style.top = (cs * (spec.mouthY || 0.7)) + 'px';
    ov.appendChild(mo);
  }

  // Arms and legs are single soft shapes, not rods with separate circles.
  const armY = Math.min(H * (spec.armY || 0.48), cs * (isOne ? 0.74 : 1.35)),
        armLen = cs * (isOne ? 0.58 : (spec.armLen || 0.72)),
        armT = Math.max(10, cs * (isOne ? 0.27 : (spec.armT || 0.28))),
        armAngle = isOne ? 32 : (spec.armAngle || 16);
  const mkArm = (right) => {
    const arm = document.createElement('div'); arm.className = 'limb arm-limb';
    arm.style.height = armT + 'px'; arm.style.width = armLen + 'px'; arm.style.top = (armY - armT / 2) + 'px';
    arm.style.transform = `rotate(${right ? -armAngle : armAngle}deg)`;
    if (right) {
      arm.style.left = (W - armLen * 0.08) + 'px';
      arm.style.setProperty('--bulb-x', '82%');
    } else {
      arm.style.left = (-armLen * 0.92) + 'px';
      arm.style.transform += ' scaleX(-1)';
      arm.style.setProperty('--bulb-x', '82%');
    }
    ov.appendChild(arm);
  };
  mkArm(false); mkArm(true);

  // legs + feet (below, slightly splayed)
  const legLen = Math.max(14, cs * (isOne ? 0.42 : (spec.legLen || 0.5))),
        legW = Math.max(10, cs * (isOne ? 0.27 : (spec.legW || 0.28)));
  const mkLeg = (cx, out) => {
    const leg = document.createElement('div'); leg.className = 'limb leg-limb';
    leg.style.width = legW + 'px'; leg.style.height = legLen + 'px';
    leg.style.left = (cx - legW / 2 + out) + 'px'; leg.style.top = (H - legLen * 0.08) + 'px';
    leg.style.transform = `rotate(${out < 0 ? 7 : -7}deg)`;
    ov.appendChild(leg);
  };
  const legX = Math.min(W * (spec.legSpread || 0.24), cs * 0.75);
  mkLeg(W / 2 - legX, -legW * 0.25); mkLeg(W / 2 + legX, legW * 0.25);

  const badge = makeBadge(spec, cs, W);
  const hat = makeHat(spec, cs, W);
  if (badge) ov.appendChild(badge);
  if (hat) ov.appendChild(hat);
  return ov;
}
// Attach the character overlay to a figure box for the friendly 1–10 blocks;
// returns true if it decorated (so callers can skip the plain per-cell face).
function decorateFigure(box, n, cs, cols, rows) {
  if (!(n >= 1 && n <= 10)) return false;
  box.style.position = 'relative'; box.style.overflow = 'visible';
  box.classList.add('numberblock-figure', `nb-${n}`);
  box.classList.toggle('one-figure', n === 1);
  box.appendChild(buildCharacter(n, cs, cols, rows));
  return true;
}

}

const QUADRANTS = [
  { c0:0,c1:4,r0:0,r1:4 }, { c0:0,c1:4,r0:5,r1:9 },
  { c0:5,c1:9,r0:0,r1:4 }, { c0:5,c1:9,r0:5,r1:9 },
];
// Returns ordered [{col,row,cat}], with .isQuarter flag for 25/50/75/100.
// layout: undefined (quarters when they apply, else vertical), 'quarter',
// 'vertical' (tenths as columns), or 'horizontal' (tenths as rows).
function buildFillPlan(n, layout) {
  const plan = [];
  if (n > 0 && n % 25 === 0 && (!layout || layout === 'quarter')) {
    for (let q = 0; q < n / 25; q++) {
      const Q = QUADRANTS[q];
      for (let col = Q.c0; col <= Q.c1; col++)
        for (let row = Q.r0; row <= Q.r1; row++) plan.push({ col, row, cat: 'quarter' });
    }
    plan.isQuarter = true; return plan;
  }
  const flip = layout === 'horizontal';
  const fullLines = Math.floor(n / 10), rem = n % 10;
  for (let line = 0; line < fullLines; line++)
    for (let i = 0; i < 10; i++)
      plan.push(flip ? { col: i, row: line, cat: 'tenth' } : { col: line, row: i, cat: 'tenth' });
  for (let i = 0; i < rem; i++)
    plan.push(flip ? { col: i, row: fullLines, cat: 'hundredth' } : { col: fullLines, row: i, cat: 'hundredth' });
  return plan;
}

function mkCell(cs, style) {

// Build number n in the given shape into `box`. Returns { cells }.
// `thousand`: each cell represents 1000 and gets a decorative grid pattern.
function buildShape(box, n, shape, cs, thousand, labelValue = n) {
  box.innerHTML = '';
  const cells = []; let topLeft = null;
  const cls = thousand ? 'thousand' : '';
  if (shape.kind === 'place') {
    box.style.display = 'flex'; box.style.alignItems = 'flex-end'; box.style.justifyContent = 'center'; box.style.gap = '10px';
    let gi = 0;
    getPlaceParts(n).forEach((p, pi) => {
      const g = document.createElement('div'); g.className = 'wgrid'; g.style.gap = '2px';
      const { cols, rows } = placeDims(p);
      g.style.gridTemplateColumns = `repeat(${cols}, ${cs}px)`;
      g.style.gridTemplateRows = `repeat(${rows}, ${cs}px)`;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const cell = mkCell(cs, unitStyle(n, gi, r, c)); if (cls) cell.classList.add(cls); if (shape.hundred) cell.classList.add('hundred-unit');
        cell.style.gridRow = rows - r; cell.style.gridColumn = c + 1;

        g.appendChild(cell); cells.push(cell); gi++;

    box.style.gridTemplateColumns = `repeat(${side}, ${cs}px)`;

    const coords = [];
    for (let r = 0; r < side; r++) for (let c = 0; c < side; c++) {
      const inCenter = r >= offset && r < offset + inner && c >= offset && c < offset + inner;
      if (!inCenter) coords.push({ r, c });

    for (let r = offset; r < offset + inner; r++) for (let c = offset; c < offset + inner; c++) coords.push({ r, c });
    coords.forEach(({ r, c }, i) => {

function largePlaceParts(k) {

function largePartFit(parts, focusIndex = null) {
  const dims = parts.map(p => {
    const shapes = allShapes(p.n);
    const shape = { ...shapes[defaultShapeIndex(p.n, shapes)], hundred: !!p.hundred };
    return { ...p, shapes, shape, dims: shapeDims(p.n, shape) };
  });
  const gapPx = 22;
  const availW = stageWrap.clientWidth * 0.98 - gapPx * Math.max(0, dims.length - 1);
  const availH = stageWrap.clientHeight * 0.88;
  const scaleFor = (p, i) => {
    if (focusIndex == null || focusIndex === 0) return p.kind === 'thousands' ? 1 : p.kind === 'hundreds' ? 0.2 : 0.14;
    if (i < focusIndex) return 0.52;
    if (i === focusIndex) return 1;
    return Math.max(0.34, 0.5 - (i - focusIndex - 1) * 0.1);
  };
  const unitCols = dims.reduce((s, p, i) => s + (p.dims.cols + (p.dims.gaps || 0) / 10) * scaleFor(p, i), 0);
  const maxRows = Math.max(...dims.map((p, i) => p.dims.rows * scaleFor(p, i)), 1);
  const cs = Math.max(4, Math.min(44, Math.floor(Math.min(availW / Math.max(unitCols, 1), availH / maxRows))));
  return { dims: dims.map((p, i) => ({ ...p, cs: Math.max(4, Math.round(cs * scaleFor(p, i))), focused: i === focusIndex })), gapPx };

    const label = document.createElement('div'); label.className = 'wlabel show'; label.textContent = hideAnswer ? '?' : fmtInt(p.label);
    group.append(box, label); wholeEl.appendChild(group);
    cells.forEach((cell, i) => setTimeout(() => { if (tk === token) cell.classList.add('show'); }, 30 + (count + i) * 6));

  });
  stageWrap.style.cursor = 'default';
  positionLargeFocus(focusIndex);
  if (!(await sleep(Math.min(900, 80 + count * 6), tk))) return;
  largeNumberText(k, parts, combo, exact, negative);
}

function focusLargeGroup(index) {
  if (!currentLarge) return;

}

async function renderWhole(k, exact, combo, negative) {
  token++; const tk = token;

  wholeEl.style.gap = '0';

  const thousand = k >= 10000;                          // each cell = one 1000

  decimalEl.textContent = hideAnswer ? '?' : (negative ? '−' : '') + fmtInt(k);

  if (k === 0) { subtitleEl.innerHTML = '<b>Zero</b> — no blocks at all!'; current = null; return; }

  }
  wholeEl.classList.remove('large-zoom'); wholeEl.style.transform = ''; currentLarge = null;

  // clicking anywhere in the field rotates (helps thin single-line numbers)

}

// ===================== COMBINE (a op b) ANIMATION =====================
function renderMini(container, n) {
  container.innerHTML = '';
  if (n >= 1 && n <= 10) {
    const shapes = allShapes(n);
    const shape = shapes[defaultShapeIndex(n, shapes)];
    const dims = shapeDims(n, shape);
    const availH = stageWrap.clientHeight * 0.55, availW = stageWrap.clientWidth * 0.26;
    let cs = Math.floor(Math.min(availH / Math.max(dims.rows, 1), (availW - (dims.gaps || 0)) / Math.max(dims.cols, 1)));
    cs = Math.max(14, Math.min(cs, 42));
    const { cells } = buildShape(container, n, shape, cs);
    cells.forEach(c => c.classList.add('show'));
    return;
  }
  const s = getShape(n);
  const availH = stageWrap.clientHeight * 0.55, availW = stageWrap.clientWidth * 0.26;
  let cs = Math.floor(Math.min(availH / s.rows, availW / s.cols));
  cs = Math.max(12, Math.min(cs, 40));
  container.style.gridTemplateColumns = `repeat(${s.cols}, ${cs}px)`;
  container.style.gridTemplateRows = `repeat(${s.rows}, ${cs}px)`;
  let idx = 0, topLeft = null;
  for (let r = 0; r < s.rows; r++) {
    const colsInRow = (r === s.rows - 1) ? s.lastRowCols : s.cols;
    for (let c = 0; c < colsInRow; c++) {
      const cell = document.createElement('div');
      cell.className = 'mcell';
      cell.style.width = cs + 'px'; cell.style.height = cs + 'px';
      const { bg, border } = getBlockColorAndBorder(n, idx);
      cell.style.background = bg; if (border) cell.style.borderColor = border;
      cell.style.gridRow = s.rows - r; cell.style.gridColumn = c + 1;
      if (s.rows - r === 1 && c === 0) topLeft = cell;
      container.appendChild(cell); idx++;
    }
  }
  if (topLeft) { topLeft.style.overflow = 'visible'; topLeft.innerHTML = faceHTML(n === 1); }
  addNumberling(container, n, cs, s.cols);
}

// Subtraction: a and b dance in; b lays over a, the overlap vanishes, leaving
// the (often crooked) answer behind. e.g. 10 - 3 leaves a crooked 7.
async function runSubtract(a, b, result) {
  token++; const tk = token;
  showWholeStage(); wholeEl.innerHTML = '';
  wholeEl.style.display = 'flex'; wholeEl.style.alignItems = 'center';
  wholeEl.style.justifyContent = 'center'; wholeEl.style.gap = '46px';
  divided = false; mode = 'subtract';
  decimalEl.textContent = `${fmtInt(a)} − ${fmtInt(b)}`;
  fractionEl.innerHTML = ''; breakEl.innerHTML = '';
  serverLog({ type: 'demo', kind: 'subtract', value: `${a}-${b}=${result}` });

  const shA = allShapes(a), shB = allShapes(b);
  const shapeA = shA[defaultShapeIndex(a, shA)], shapeB = shB[defaultShapeIndex(b, shB)];
  const cs = Math.min(fitCellSize(a, shapeA), fitCellSize(b, shapeB), 40);

  const boxA = document.createElement('div');
  const boxB = document.createElement('div');
  boxB.style.transition = 'transform 0.7s ease, opacity 0.5s ease';
  wholeEl.append(boxA, boxB);
  const { cells: cellsA } = buildShape(boxA, a, shapeA, cs);
  const { cells: cellsB } = buildShape(boxB, b, shapeB, cs);

  cellsA.forEach((c, i) => setTimeout(() => { if (tk === token) c.classList.add('show'); }, 20 + i * 14));
  subtitleEl.innerHTML = `Here's <b>${fmtInt(a)}</b>...`;
  if (!(await sleep(20 + cellsA.length * 14 + 350, tk))) return;

  subtitleEl.innerHTML = `...now take away <b>${fmtInt(b)}</b>`;
  boxB.classList.add('walk-in-right');
  cellsB.forEach(c => c.classList.add('show'));
  if (!(await sleep(1550, tk))) return;

  // b lays over the top `b` blocks of a
  const removed = cellsA.slice(a - b);
  removed.forEach(c => c.classList.add('subtracted'));
  boxB.style.transform = `translateX(-${Math.round(boxA.offsetWidth / 2 + 24)}px)`;
  boxB.style.opacity = '0';
  subtitleEl.innerHTML = `<b>${fmtInt(b)}</b> takes ${fmtInt(b)} block${b > 1 ? 's' : ''} away...`;
  if (!(await sleep(560, tk))) return;

  removed.forEach(c => { c.style.transition = 'opacity 0.4s, transform 0.4s';
    c.style.opacity = '0'; c.style.transform = 'scale(0.15)'; });
  if (!(await sleep(480, tk))) return;
  boxB.remove();

  // move the face to the top-left of what's left (the crooked answer)
  cellsA.forEach(c => { if (c.querySelector('.nb-face')) c.innerHTML = ''; });
  const remain = cellsA.filter(c => !c.classList.contains('subtracted'));
  let faceCell = null, bestRow = 1e9, bestCol = 1e9;
  remain.forEach(c => { const gr = +c.style.gridRow, gc = +c.style.gridColumn;
    if (gr < bestRow || (gr === bestRow && gc < bestCol)) { bestRow = gr; bestCol = gc; faceCell = c; } });
  if (faceCell) { faceCell.style.overflow = 'visible'; faceCell.innerHTML = faceHTML(result === 1); }
  boxA.classList.add('dancing');
  if (!hideAnswer) decimalEl.textContent = `${fmtInt(a)} − ${fmtInt(b)} = ${fmtInt(result)}`;
  subtitleEl.innerHTML = `<b>${fmtInt(a)} − ${fmtInt(b)} = ${fmtInt(result)}</b> — now tidy it up...`;
  fractionEl.innerHTML = `<span class="frac">${fmtInt(a)} − ${fmtInt(b)}</span><span class="eq">=</span><span class="reduced">${fmtInt(result)}</span>`;
  if (result < 1) { return; }   // 0 or negative: nothing to reshape
  // ...then the leftover reshapes into the proper Numberblock.
  if (!(await sleep(1300, tk))) return;
  await renderWhole(result, true, { a, op: '−', b });
}

// ===================== MULTIPLY (array of groups) & DIVIDE (sharing) =====================
// A mini Numberblock of `value` sized so `groupCount` of them fit across the stage.
function groupCellSize(value, groupCount) {
  const s = getShape(value);
  const perW = (stageWrap.clientWidth * 0.9) / groupCount - 14;
  const availH = stageWrap.clientHeight * 0.6;
  return Math.max(8, Math.min(Math.floor(Math.min(perW / s.cols, availH / s.rows)), 38));
}
function buildMiniGroup(value, cs) {
  const w = mkOperand(); w.l.textContent = value;
  const s = getShape(value);
  w.g.style.gridTemplateColumns = `repeat(${s.cols}, ${cs}px)`;
  w.g.style.gridTemplateRows = `repeat(${s.rows}, ${cs}px)`;
  let idx = 0, topLeft = null;
  for (let r = 0; r < s.rows; r++) {
    const cir = (r === s.rows - 1) ? s.lastRowCols : s.cols;
    for (let c = 0; c < cir; c++) {
      const cell = document.createElement('div'); cell.className = 'mcell';
      cell.style.width = cs + 'px'; cell.style.height = cs + 'px';
      const col = getBlockColorAndBorder(value, idx);
      cell.style.background = col.bg; if (col.border) cell.style.borderColor = col.border;
      cell.style.gridRow = s.rows - r; cell.style.gridColumn = c + 1;
      if (s.rows - r === 1 && c === 0) topLeft = cell;
      w.g.appendChild(cell); idx++;
    }
  }
  if (topLeft) { topLeft.style.overflow = 'visible'; topLeft.innerHTML = faceHTML(value === 1); }
  addNumberling(w.g, value, cs, s.cols);
  return w;
}

// a ÷ b = share a into b equal groups; each group is the answer.

// Divide by 10/100/1000: hop the decimal point left across the written number.
async function runDecimalShift(a, b, places) {
  token++; const tk = token;
  showCombineStage(); combineEl.innerHTML = '';
  combineEl.style.gap = '0'; combineEl.style.flexDirection = 'column';
  divided = false; mode = 'combine';
  decimalEl.textContent = `${fmtInt(a)} ÷ ${fmtInt(b)}`;
  fractionEl.innerHTML = ''; breakEl.innerHTML = '';
  subtitleEl.innerHTML = `Dividing by <b>${fmtInt(b)}</b> slides the decimal point <b>${places}</b> place${places > 1 ? 's' : ''} left!`;
  serverLog({ type: 'demo', kind: 'decshift', value: `${a}/${b}` });

  const wrap = document.createElement('div'); wrap.className = 'decshift';
  combineEl.appendChild(wrap);
  const digits = String(a).split('');
  // pointPos = number of digits to the LEFT of the point (starts at far right)
  function render(pointPos, hop) {
    const ds = digits.slice(); let pos = pointPos;
    while (pos < 1) { ds.unshift('0'); pos++; }   // pad leading zeros
    wrap.innerHTML = '';
    ds.forEach((d, i) => {
      if (i === pos) { const dot = document.createElement('span');
        dot.className = 'dot' + (hop ? ' hop' : ''); dot.textContent = '.'; wrap.appendChild(dot); }
      const sp = document.createElement('span'); sp.className = 'dig'; sp.textContent = d; wrap.appendChild(sp);
    });
    if (pos >= ds.length) { const dot = document.createElement('span');
      dot.className = 'dot' + (hop ? ' hop' : ''); dot.textContent = '.'; wrap.appendChild(dot); }
  }
  let pointPos = digits.length;
  render(pointPos, false);
  if (!(await sleep(750, tk))) { combineEl.style.flexDirection = ''; return; }
  for (let step = 0; step < places; step++) {
    pointPos -= 1;
    render(pointPos, true);
    if (!(await sleep(820, tk))) { combineEl.style.flexDirection = ''; return; }
  }
  // settle on the clean result
  const resStr = shiftedString(a, places);
  wrap.innerHTML = '';
  resStr.split('').forEach(ch => { const sp = document.createElement('span');
    sp.className = ch === '.' ? 'dot' : 'dig'; sp.textContent = ch; wrap.appendChild(sp); });
  combineEl.style.flexDirection = '';
  subtitleEl.innerHTML = `<b>${fmtInt(a)} ÷ ${fmtInt(b)} = ${resStr}</b>!`;
  fractionEl.innerHTML = `<span class="frac">${a} ÷ ${b}</span><span class="eq">=</span><span class="reduced">${resStr}</span>`;

  // ...then show that same result as blocks (numbers first, blocks second).
  if (!(await sleep(1200, tk))) return;
  const r = routeValue(a / b);
  if (!r) return;
  if (r.mode === 'whole') await renderWhole(r.k, r.exact, { a, op: '÷', b });
  else if (r.mode === 'negative') await renderWhole(r.k, true, null, true);
  else if (r.mode === 'mixed') await renderMixed(r.whole, r.n, r.exact, r.disp);
  else await demonstrateDecimal(r.n, r.exact, r.disp);
}

// ===================== MIXED-NUMBER RENDER (whole + fractional block) =====================
function buildUnitSquare(size, opts) {
  // opts: { solid:true } | { n:hundredths } ; face:boolean
  const unit = document.createElement('div');
  unit.className = 'unit' + (opts.solid ? ' solid' : '');
  unit.style.width = size + 'px'; unit.style.height = size + 'px';
  if (opts.solid) {
    if (opts.face) { unit.style.overflow = 'visible'; unit.innerHTML = faceHTML(true); }
  } else {
    const g = document.createElement('div'); g.className = 'unit-grid';
    g.style.width = size + 'px'; g.style.height = size + 'px';
    const map = {};
    for (let col = 0; col < 10; col++)
      for (let row = 0; row < 10; row++) {
        const c = document.createElement('div'); c.className = 'ucell';
        c.style.gridColumn = col + 1; c.style.gridRow = 10 - row;
        g.appendChild(c); map[col + ',' + row] = c;
      }
    for (const p of buildFillPlan(opts.n, opts.layout)) map[p.col + ',' + p.row].className = 'ucell ' + p.cat;
    unit.appendChild(g);
    if (opts.face) { const f = document.createElement('div'); f.innerHTML = faceHTML(true);
      f.firstChild.style.zIndex = 5; unit.appendChild(f.firstChild); unit.style.overflow = 'visible'; }
  }
  return unit;
}

// Click the decimal block to cycle its fill layout: quarters (when they apply),
// vertical tenths (columns), horizontal tenths (rows). Same spirit as
// enableReshape, but re-paints the unit grid's cells in place.
function enableUnitReshape(unit, n) {
  if (!Number.isInteger(n) || n < 1 || n > 99) return;
  const layouts = ['vertical', 'horizontal'];
  // 50's quarter layout (left half) is identical to its vertical one — skip it
  if (n % 25 === 0 && n !== 50) layouts.unshift('quarter');
  let li = 0;
  unit.style.cursor = 'pointer'; unit.title = 'Tap to change shape';
  unit.addEventListener('click', (e) => {
    e.stopPropagation();
    li = (li + 1) % layouts.length;
    const g = unit.querySelector('.unit-grid');
    if (!g) return;
    for (const c of g.children) c.className = 'ucell';
    // cells were appended col-major: child index = col * 10 + row
    for (const p of buildFillPlan(n, layouts[li]))
      g.children[p.col * 10 + p.row].className = 'ucell ' + p.cat;
    serverLog({ type: 'reshape', kind: 'decimal', value: n, layout: layouts[li] });
  });
}

async function renderMixed(whole, n, exact, trueDisp) {
  token++; const tk = token;
  showWholeStage();
  divided = false; mode = 'mixed';
  const disp = fmtMixed(whole, n);
  const label = (!exact && trueDisp) ? trueDisp : disp;   // show the true value, not the rounded one
  decimalEl.textContent = label;
  serverLog({ type: 'demo', kind: 'mixed', value: label });

  // Two arrangements: 'apart' (whole Numberblock + decimal square) and
  // 'together' (one cohesive figure — a tower of big "one" blocks wearing the
  // decimal square on top as a slightly-smaller head). Tap + to snap together;
  // tap the figure's body to split apart. Towers taller than 6 get unwieldy.
  const canCombine = whole <= 6;
  let arrangement = 'apart';

  const notExactNote = exact ? '' : ` <span style="opacity:.85">(blocks shown to the nearest hundredth)</span>`;
  function setApartText() {
    subtitleEl.innerHTML = `<b>${fmtInt(whole)}</b> and <b>${fmtDecimal(n)}</b> more` +
      (canCombine ? ` <span style="opacity:.7">· tap the + to snap together</span>` : '') + notExactNote;
  }
  function setTogetherText() {
    subtitleEl.innerHTML = `<b>${label}</b> — all together, one Numberblock!` +
      ` <span style="opacity:.7">· tap its body to split apart</span>` + notExactNote;
  }

  // The whole part is its NORMAL Numberblock (real shape + place-value colors);
  // the decimal part is shown beside it as a subdivided unit block.
  function buildApart(animate) {
    wholeEl.innerHTML = ''; wholeEl.style.display = 'flex'; wholeEl.style.alignItems = 'flex-end';
    wholeEl.style.justifyContent = 'center'; wholeEl.style.gap = '16px';
    const shapes = allShapes(whole);
    const shape = shapes[defaultShapeIndex(whole, shapes)];
    const { cols, rows, gaps } = shapeDims(whole, shape);
    const availW = stageWrap.clientWidth * 0.92, availH = stageWrap.clientHeight * 0.78;
    let cs = Math.floor(Math.min((availW * 0.6 - gaps) / cols, availH / rows));
    cs = Math.max(4, Math.min(cs, 46));
    let fs = Math.max(cs, 66);                       // decimal block stays legible
    fs = Math.min(fs, Math.floor(availH * 0.7), Math.floor(availW * 0.32));

    // whole Numberblock
    const wbox = document.createElement('div'); wbox.className = 'dancing';
    const { cells } = buildShape(wbox, whole, shape, cs);
    enableReshape(wbox, whole, blockFit(whole, 0.552, 0.78, 46));   // click the whole part to reshape it
    const wgroup = document.createElement('div'); wgroup.className = 'wgroup';
    const wlbl = document.createElement('div'); wlbl.className = 'wlabel show'; wlbl.textContent = fmtInt(whole);
    wgroup.append(wbox, wlbl);

    const plus = document.createElement('div'); plus.className = 'wplus show'; plus.textContent = '+';
    if (canCombine) {
      plus.style.cursor = 'pointer'; plus.style.pointerEvents = 'auto'; plus.title = 'Tap to snap together!';
      plus.addEventListener('click', (e) => { e.stopPropagation(); buildTogether(); });
    }

    // decimal part
    const fgroup = document.createElement('div'); fgroup.className = 'wgroup dancing';
    const fblock = buildUnitSquare(fs, { n, face: false });
    enableUnitReshape(fblock, n);
    const flbl = document.createElement('div'); flbl.className = 'wlabel show'; flbl.textContent = fmtDecimal(n);
    fgroup.append(fblock, flbl);

    wholeEl.append(wgroup, plus, fgroup);
    if (!animate) { cells.forEach(c => c.classList.add('show')); fblock.classList.add('show'); }
    return { cells, fblock };
  }

  function buildTogether() {
    arrangement = 'together';
    wholeEl.innerHTML = ''; wholeEl.style.display = 'flex'; wholeEl.style.alignItems = 'flex-end';
    wholeEl.style.justifyContent = 'center'; wholeEl.style.gap = '16px';
    const availW = stageWrap.clientWidth * 0.92, availH = stageWrap.clientHeight * 0.88;
    // each "one" is slightly larger than the decimal head, so the stack reads
    // as one figure: broad body, smaller head on top (plus room for legs)
    let u = Math.floor(Math.min(availH / (whole + 1.2), availW * 0.5, 170));
    u = Math.max(40, u);
    const d = Math.round(u * 0.82);

    const fig = document.createElement('div');
    fig.className = 'wgroup dancing';
    fig.style.gap = '2px'; fig.style.cursor = 'pointer';
    fig.title = 'Tap to split apart';

    const head = buildUnitSquare(d, { n, face: false });
    head.classList.add('merged-head');
    enableUnitReshape(head, n);                      // head still cycles its fill
    fig.appendChild(head);

    // the body is a real One-style figure: One's block styling on each cell,
    // with One's face, arms and legs sized to the whole tower
    const body = document.createElement('div');
    body.className = 'one-figure';
    body.style.position = 'relative'; body.style.overflow = 'visible';
    body.style.display = 'flex'; body.style.flexDirection = 'column'; body.style.gap = '2px';
    body.style.marginBottom = Math.round(Math.max(14, u * 0.42) * 0.8) + 'px';  // legs
    const bodyBlocks = [head];
    for (let i = 0; i < whole; i++) {
      const one = document.createElement('div');
      one.className = 'wcell';
      one.style.width = u + 'px'; one.style.height = u + 'px';
      body.appendChild(one); bodyBlocks.push(one);
    }
    body.appendChild(buildCharacter(1, u, 1, whole));
    fig.appendChild(body);
    const lbl = document.createElement('div'); lbl.className = 'wlabel show'; lbl.textContent = label;
    fig.appendChild(lbl);
    fig.addEventListener('click', () => {
      arrangement = 'apart';
      buildApart(false); setApartText();
      serverLog({ type: 'reshape', kind: 'mixed-split', value: label });
    });
    wholeEl.appendChild(fig);
    // pop in from the bottom up, head last
    bodyBlocks.slice().reverse().forEach((b, i) => setTimeout(() => {
      if (tk === token) b.classList.add('show');
    }, 30 + i * 90));
    setTogetherText();
    serverLog({ type: 'reshape', kind: 'mixed-combine', value: label });
  }

  const { cells, fblock } = buildApart(true);

  // animate: pop the whole number's blocks, then the decimal block
  const step = Math.max(5, Math.min(20, Math.floor(500 / Math.max(cells.length, 1))));
  cells.forEach((c, i) => setTimeout(() => { if (tk === token) c.classList.add('show'); }, 20 + i * step));
  setTimeout(() => { if (tk === token) fblock.classList.add('show'); }, 40 + cells.length * step + 150);
  if (!(await sleep(40 + cells.length * step + 500, tk))) return;

  const g = gcd(n, 100), rn = n / g, rd = 100 / g;
  if (arrangement === 'apart') setApartText(); else setTogetherText();
  fractionEl.innerHTML = `<span class="frac">${disp}</span><span class="eq">=</span>` +
    `<span class="reduced">${whole} ${rn}/${rd}</span>`;
  breakEl.innerHTML = `<span class="p">${whole} whole${whole > 1 ? 's' : ''}</span> + ` +
    `<span class="h">${n} hundredth${n > 1 ? 's' : ''}</span>`;
}

// ===================== ROUTER =====================
// Combine "a op b" animates; everything else routes to whole / mixed / decimal.
async function present(raw) {
  const dv = parseDivByPowerOf10(raw);      // 250/10 etc. -> hopping decimal point
  if (dv) { await runDecimalShift(dv.a, dv.b, dv.places); return; }
  const eq = parseEquation(raw);
  if (eq) {
    if (eq.type === 'split') await runSplit(eq.total, eq.a, eq.op, eq.b);
    else if (eq.op === '-') await runSubtract(eq.a, eq.b, eq.result);
    else if (eq.op === '*') await runMultiply(eq.a, eq.b, eq.result);
    else if (eq.op === '/') await runDivide(eq.a, eq.b, eq.result);
    else await runCombine(eq.a, eq.sym, eq.b, eq.result);
    return;
  }
  const combo = parseBinary(raw);
  if (combo) {
    if (combo.opRaw === '-') await runSubtract(combo.a, combo.b, combo.result);
    else if (combo.opRaw === '*') await runMultiply(combo.a, combo.b, combo.result);
    else if (combo.opRaw === '/') await runDivide(combo.a, combo.b, combo.result);
    else await runCombine(combo.a, combo.op, combo.b, combo.result);
    return;
  }
  const r = routeValue(evalExpr(raw));
  if (!r) { subtitleEl.textContent = 'Try 102, 1.5, 1+2, 10-3, or -7'; return; }
  if (r.mode === 'whole') await renderWhole(r.k, r.exact);
  else if (r.mode === 'negative') await renderWhole(r.k, true, null, true);
  else if (r.mode === 'mixed') await renderMixed(r.whole, r.n, r.exact, r.disp);
  else await demonstrateDecimal(r.n, r.exact, r.disp);
}
function handle(raw) { stopTour(); present(raw); }

function backToOne() {
  token++; mode = 'idle';
  hideAnswer = false;
  showNormalOneIntro();
  decimalEl.textContent = '1';
  fractionEl.innerHTML = ''; breakEl.innerHTML = '';
  subtitleEl.innerHTML = 'Type a number — a whole number like <b>102</b>, a decimal like <b>0.42</b>, or a mix like <b>1.5</b>.';
}

// ===================== TOUR =====================
const TOUR = ['0.5', '25', '34', '102', '1+2', '10-3', '3×4', '12÷3', '3=1+2', '1.5', '0.33'];
let tourRunning = false, tourTimer = null;
async function runTour() {
  tourRunning = true;
  let i = 0;
  while (tourRunning) {
    await present(TOUR[i % TOUR.length]);
    if (!tourRunning) break;
    await new Promise(res => { tourTimer = setTimeout(res, 2600); });
    i++;
  }
}
function stopTour() { tourRunning = false; if (tourTimer) clearTimeout(tourTimer); }

// ===================== MODES + GAME =====================
const inputEl = document.getElementById('num-input');
let appMode = 'entry';
let gamePhase = 'guess';         // 'guess' | 'free'
let gameTarget = 0, lastTarget = 0;

function setMode(m) {
  stopTour(); token++;           // cancel any running animation loop
  appMode = m;
  document.body.classList.remove('mode-entry', 'mode-game', 'mode-tour');
  document.body.classList.add('mode-' + m);
  document.querySelectorAll('.modebtn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  hideAnswer = false; inputEl.value = '';
  if (m === 'entry') { inputEl.placeholder = 'type e.g. 102, 1.5, 1+2, 10-3, 3=1+2'; backToOne(); }
  else if (m === 'tour') { backToOne(); runTour(); }
  else if (m === 'game') { startGame(); }
}

function pickTarget() {
  const nice = [15, 16, 18, 20, 24, 25, 30];
  let n;
  do {
    const r = Math.random();
    if (r < 0.7) n = Math.floor(Math.random() * 12) + 1;
    else if (r < 0.9) n = Math.floor(Math.random() * 8) + 13;
    else n = nice[Math.floor(Math.random() * nice.length)];
  } while (n === lastTarget);
  lastTarget = n; return n;
}
async function startGame() { await newGuessRound(); }
async function newGuessRound() {
  gamePhase = 'guess'; hideAnswer = true;
  inputEl.value = ''; inputEl.placeholder = 'type the number...';
  gameTarget = pickTarget();
  await renderWhole(gameTarget, true);
  if (appMode === 'game' && hideAnswer) subtitleEl.innerHTML = 'What number is this? Type its name!';
}
function checkGuess(raw) {
  const v = evalExpr(raw); const g = (v == null) ? NaN : Math.round(v);
  if (g === gameTarget) winRound();
  else { subtitleEl.innerHTML = `Not quite — try again!` + (isNaN(g) ? '' : ` <span style="opacity:.75">(you typed ${g})</span>`); wobble(); }
}
async function winRound() {
  hideAnswer = false; gamePhase = 'free';
  decimalEl.textContent = fmtInt(gameTarget);
  if (current && current.box) { current.box.classList.add('cheering');
    setTimeout(() => { if (current && current.box) current.box.classList.remove('cheering'); }, 1300); }
  celebrate();
  subtitleEl.innerHTML = `🎉 Yes! It's <b>${fmtInt(gameTarget)}</b>! Now type your <b>own</b> number.`;
  breakEl.innerHTML = '';
  inputEl.value = ''; inputEl.placeholder = 'type any number...';
}
async function freeEntry(raw) {
  hideAnswer = false;
  await present(raw);
  if (appMode === 'game') subtitleEl.innerHTML += ` <span style="opacity:.85">— tap ▶ Next number for a new challenge!</span>`;
}
function celebrate() {
  const colors = ['#DE151D', '#E89223', '#E6C40C', '#38B500', '#23B0DB', '#5A35C3', '#FD40A4'];
  const w = stageWrap.clientWidth, h = stageWrap.clientHeight;
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = (w / 2) + 'px'; c.style.top = (h / 2) + 'px';
    c.style.background = colors[i % colors.length];
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 200;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 140, dr = Math.random() * 720 - 360;
    const dur = 0.9 + Math.random() * 0.6;
    c.style.transform = 'translate(0,0)'; c.style.opacity = '1';
    stageWrap.appendChild(c);
    void c.offsetWidth;   // commit the start state so the transition animates
    c.style.transition = `transform ${dur}s ease-out, opacity ${dur}s ease-out`;
    c.style.transform = `translate(${dx}px, ${dy}px) rotate(${dr}deg)`;
    c.style.opacity = '0';
    setTimeout(() => c.remove(), dur * 1000 + 300);
  }
}
function wobble() {
  inputEl.style.transition = 'transform .08s';
  inputEl.style.transform = 'translateX(-7px)';
  setTimeout(() => inputEl.style.transform = 'translateX(7px)', 80);
  setTimeout(() => inputEl.style.transform = '', 160);
}

// ===================== WIRING =====================
document.querySelectorAll('.chip[data-v]').forEach(btn =>
  btn.addEventListener('click', () => handle(btn.dataset.v)));
document.querySelectorAll('.modebtn').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));
document.getElementById('reset-btn').addEventListener('click', () => { stopTour(); backToOne(); });
document.getElementById('next-btn').addEventListener('click', () => newGuessRound());
document.getElementById('reset-btn2').addEventListener('click', () => newGuessRound());
function submitInput() {
  const raw = inputEl.value.trim();
  if (raw === '') return;
  if (appMode === 'game') {
    if (gamePhase === 'guess') { checkGuess(raw); }
    else {
      if (parseEquation(raw) == null && parseBinary(raw) == null && evalExpr(raw) == null) {
        subtitleEl.textContent = 'Try a number like 7, 12, or 1+2'; return;
      }
      freeEntry(raw);
    }
    return;
  }
  if (parseEquation(raw) == null && parseBinary(raw) == null && evalExpr(raw) == null) {
    subtitleEl.textContent = 'Hmm — try 102, 1.5, 1+2, 10-3, or 3=1+2'; return;
  }
  handle(raw);
}
document.getElementById('go').addEventListener('click', submitInput);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });
// Type-to-focus: keystrokes anywhere on the page flow into the number field
// even if it lost focus (e.g. after clicking a block or a button).
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;      // leave shortcuts alone
  if (document.activeElement === inputEl) return;       // already typing in it
  if (e.key === 'Enter') { e.preventDefault(); inputEl.focus(); submitInput(); }
  else if (e.key === 'Backspace') { e.preventDefault(); inputEl.focus(); inputEl.value = inputEl.value.slice(0, -1); }
  else if (e.key.length === 1) { e.preventDefault(); inputEl.focus(); inputEl.value += e.key; }
});
// Tap a decimal to expand it again (re-grow One into the 100-grid).
square.addEventListener('click', () => { if (mode === 'decimal') { stopTour(); demonstrateDecimal(currentDecimalN, true); } });
// Tap anywhere in the field to rotate a whole number's shape (incl. math results).
stageWrap.addEventListener('click', () => {
  if (mode === 'whole' && current && current.shapes.length > 1) rotateShape();
});
stageWrap.addEventListener('wheel', (e) => {
  if (!currentLarge) return;
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(delta) < 8) return;
  focusLargeGroup(currentLarge.focusIndex + (delta > 0 ? 1 : -1));
}, { passive: false });

let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => {
  sizeSquare();
  if (currentLarge) renderLargeWhole(currentLarge.k, currentLarge.exact, currentLarge.combo, currentLarge.negative, currentLarge.focusIndex);
  else if (mode === 'whole' && current) drawCurrent(false);   // re-fit blocks on rotate
}, 200); });
backToOne();
</script>
