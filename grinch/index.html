<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grinch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060614;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
    }
    canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: min(100vw, 177.78vh);   /* maintain 16:9 aspect, fill screen */
      height: min(56.25vw, 100vh);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
    import { Engine } from './js/engine.js';
    const canvas = document.getElementById('game');
    const engine = new Engine(canvas);
    window._engine = engine;

    // deep link: ?level=2 jumps straight into that world (used by tests/screenshots)
    const params = new URLSearchParams(location.search);
    const level = parseInt(params.get('level'), 10);
    if (level >= 1) {
      if (params.get('char') === 'max') engine.selectedCharacter = 1;
      engine.startLevel(level - 1, { showStory: params.has('story') });
    }
  </script>
</body>
</html>
