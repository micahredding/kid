<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grinch pose showcase (dev)</title>
  <style>body { background: #1a1a40; margin: 0; } canvas { display: block; }</style>
</head>
<body>
  <canvas id="c" width="1500" height="800"></canvas>
  <script type="module">
    import { drawGrinch, drawMax, drawPresent, drawSleigh, drawHeart } from './js/characters.js';
    const ctx = document.getElementById('c').getContext('2d');
    let t = 0;
    function frame() {
      t++;
      ctx.fillStyle = '#1a1a40';
      ctx.fillRect(0, 0, 1500, 800);
      ctx.fillStyle = '#e8f0ff';
      ctx.fillRect(0, 400, 1500, 4);
      ctx.fillRect(0, 700, 1500, 4);

      const modes = [
        { mode: 'idle', label: 'idle' },
        { mode: 'sneak', label: 'sneak' },
        { mode: 'sneak', label: 'sneak+2', phaseOff: Math.PI },
        { mode: 'run', label: 'run' },
        { mode: 'jump', label: 'jump' },
        { mode: 'fall', label: 'fall' },
        { mode: 'skid', label: 'skid' },
      ];
      ctx.font = '14px monospace';
      modes.forEach((m, i) => {
        const cx = 120 + i * 200;
        drawGrinch(ctx, {
          cx, feetY: 400, h: 220,
          facing: 1,
          lean: m.mode === 'sneak' ? 0.2 : m.mode === 'run' ? 0.2 : m.mode === 'skid' ? -0.25 : 0,
          phase: t * 0.09 + (m.phaseOff || 0),
          mode: m.mode,
          grin: m.mode === 'run' ? 1 : 0.4,
          eyes: m.mode === 'jump' || m.mode === 'fall' ? 'wide' : m.mode === 'run' ? 'happy' : 'sly',
          suit: i % 2 === 0,
          time: t,
        });
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(m.label + (i % 2 === 0 ? ' (suit)' : ''), cx, 430);
      });

      const maxModes = ['idle', 'trot', 'trot', 'jump'];
      maxModes.forEach((m, i) => {
        const cx = 140 + i * 240;
        drawMax(ctx, {
          cx, feetY: 700, h: 150,
          facing: 1,
          phase: t * 0.15 + (i === 2 ? Math.PI : 0),
          mode: m,
          time: t,
          earLag: Math.sin(t * 0.1) * 3,
        });
        ctx.fillStyle = '#fff';
        ctx.fillText('max ' + m, cx, 730);
      });

      drawSleigh(ctx, 1080, 700, t, 1);
      drawPresent(ctx, 1250, 600, 60, 55, '#cc2936', '#ffd700');
      drawHeart(ctx, 1400, 620, 50, '#e04858', '#fff');

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
